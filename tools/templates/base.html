<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#1A2228">
  <link rel="alternate" type="application/rss+xml" title="What The? News" href="/feed.xml">
  <link rel="stylesheet" href="/css/style.css">
  <meta property="og:site_name" content="What The? News">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  {{HEAD_EXTRA}}
</head>
<body>
<a class="skip" href="#main">Skip to stories</a>
<header class="site-header">
  <div class="brand-bar">
    <div class="wrap">
      <a class="brand" href="/">
        <img class="brand-logo" src="/images/logo/logo-256.png" srcset="/images/logo/logo-256.png 1x, /images/logo/logo-512.png 2x" width="48" height="48" alt="">
        <span class="brand-name">What The<span class="mark-q">?</span> <span class="news-stamp">News</span></span>
      </a>
      <p class="brand-meta">WorldTurtleGod Studios</p>
    </div>
  </div>
  <nav class="desk-nav" aria-label="Sections">
    <div class="nav-scroller">
      {{NAV}}
    </div>
  </nav>
</header>
{{CONTENT}}
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-credit">
      <a class="footer-logo-link" href="/" aria-label="What The? News home">
        <img class="footer-logo" src="/images/logo/logo-256.png" srcset="/images/logo/logo-256.png 1x, /images/logo/logo-512.png 2x" width="40" height="40" alt="">
      </a>
      What The? News is a WorldTurtleGod Studios project.
    </p>
    <p><a href="/about/">About</a> · <a href="/archive/">Archive</a> · <a href="/feed.xml">RSS</a></p>
  </div>
</footer>
{{SCRIPTS}}
</body>
</html>
